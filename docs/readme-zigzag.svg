  <circle cx="46" cy="58" r="4" fill="#e6a15c"/>
  <circle cx="202" cy="140" r="3.5" fill="#3dd6e0"/>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9388">
    <text x="248" y="72">→ along row 1</text>
    <text x="248" y="96">← back on row 2</text>
    <text x="248" y="120">→ along row 3</text>
    <text x="248" y="148" fill="#6b655c" font-size="11">LED 0 sits on A1</text>
