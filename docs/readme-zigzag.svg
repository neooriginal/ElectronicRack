<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 168" role="img" aria-label="Zig-zag LED path from A1">
  <rect width="420" height="168" rx="14" fill="#101216"/>
  <rect x=".5" y=".5" width="419" height="167" rx="14" fill="none" stroke="#f4efe6" stroke-opacity=".08"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9a9388">
    <text x="24" y="28">LED path · zig-zag from A1</text>
  </g>
  <!-- 4 columns x 3 rows of bins -->
  <g fill="#171a1f" stroke="#f4efe6" stroke-opacity=".12">
    <rect x="24" y="44" width="44" height="32" rx="6"/><rect x="76" y="44" width="44" height="32" rx="6"/>
    <rect x="128" y="44" width="44" height="32" rx="6"/><rect x="180" y="44" width="44" height="32" rx="6"/>
    <rect x="24" y="84" width="44" height="32" rx="6"/><rect x="76" y="84" width="44" height="32" rx="6"/>
    <rect x="128" y="84" width="44" height="32" rx="6"/><rect x="180" y="84" width="44" height="32" rx="6"/>
    <rect x="24" y="124" width="44" height="32" rx="6"/><rect x="76" y="124" width="44" height="32" rx="6"/>
    <rect x="128" y="124" width="44" height="32" rx="6"/><rect x="180" y="124" width="44" height="32" rx="6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b655c" text-anchor="middle">
    <text x="46" y="64">A1</text><text x="98" y="64">B1</text><text x="150" y="64">C1</text><text x="202" y="64">D1</text>
    <text x="46" y="104">A2</text><text x="98" y="104">B2</text><text x="150" y="104">C2</text><text x="202" y="104">D2</text>
    <text x="46" y="144">A3</text><text x="98" y="144">B3</text><text x="150" y="144">C3</text><text x="202" y="144">D3</text>
  </g>
  <!-- path -->
  <path d="M46 58 H202 Q214 58 214 70 V90 Q214 100 202 100 H46 Q34 100 34 112 V130 Q34 140 46 140 H202"
