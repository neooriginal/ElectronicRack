; ElectronicRack — ESP32 firmware for a NeoPixel component rack.
; The rack is a BLE peripheral; the web UI and database live in server/.
; Flash firmware:    pio run -t upload
; Serial monitor:    pio device monitor

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
; 921600 corrupts on this CP210x/cable combo; 460800 is reliable and barely slower.
upload_speed = 460800

lib_deps =
  bblanchon/ArduinoJson@^7.3.0
  adafruit/Adafruit NeoPixel@^1.12.5
  h2zero/NimBLE-Arduino@^1.4.2

build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -Isrc

extra_scripts =
  pre:scripts/git_flags.py
