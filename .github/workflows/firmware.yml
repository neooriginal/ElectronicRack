name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build firmware and filesystem
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          pio run
          pio run -t buildfs

      - name: Package release assets
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/firmware.bin
          cp .pio/build/esp32dev/littlefs.bin dist/littlefs.bin
          python3 scripts/write_version.py dist/version.json
          ls -la dist
          cat dist/version.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ElectronicRack-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ElectronicRack-${{ github.sha }}
          path: dist

      - name: Publish rolling latest release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: dist/firmware.bin,dist/littlefs.bin,dist/version.json
          body: |
            Automatic firmware build from `${{ github.sha }}`.

            ${{ github.event.head_commit.message }}

            Device OTA pulls these assets from this release.
